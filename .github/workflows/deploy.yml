name: Deploy

# ═══════════════════════════════════════════════════════════════
# Push SUNUCUYA DOKUNMAZ — yalnızca kodu doğrular.
# Dağıtım için Actions sekmesinden "Run workflow" ile onay vermen gerekir.
# ═══════════════════════════════════════════════════════════════
on:
  push:
    branches: [main]      # → yalnızca "verify" çalışır
  workflow_dispatch:      # → "Run workflow" ile dağıtım
    inputs:
      onay:
        description: 'Sunucuya dağıtmak için kutuya  dagit  yaz'
        required: true
        default: ''
      sema_degisti:
        description: 'Prisma şeması değişti mi? (işaretlersen db push çalışır)'
        type: boolean
        default: false
      not:
        description: 'Kısa not (yedek etiketinde görünür)'
        required: false
        default: ''

concurrency:
  group: deploy-production
  # KASITLI OLARAK false. Yarıda kesilen bir dağıtım, şeması güncellenmiş ama
  # kodu derlenmemiş bir sunucu bırakabiliyor.
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════
  # 1 · DOĞRULA — runner'da, sunucuya DOKUNMADAN
  # Derlenmeyen kod sunucuya hiç gitmiyor. Bu adımın tek amacı bu.
  # ═══════════════════════════════════════════════════════════
  verify:
    name: Doğrula
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend bağımlılıkları
        working-directory: backend
        run: npm install --include=dev --no-audit --no-fund

      - name: Prisma client
        working-directory: backend
        # Şemanın kendisi geçerli mi? DB'ye bağlanmaz.
        run: npx prisma generate

      - name: Kod bütünlüğü (sözdizimi + import yolları)
        working-directory: backend
        run: node scripts/verify-build.js

      - name: Frontend bağımlılıkları
        working-directory: frontend
        run: npm install --include=dev --no-audit --no-fund

      - name: Frontend derleme
        working-directory: frontend
        run: npm run build

      - name: Randevu izin kapısı bütünlüğü
        # prisma.appointment.create SADECE domain katmanında olmalı.
        # Yeni bir kopya eklenirse izin kapısı atlanabilir — burada yakalıyoruz.
        run: |
          COUNT=$(grep -rl "prisma\.appointment\.create" \
            backend/controllers backend/services backend/utils backend/adapters backend/helpers \
            2>/dev/null | grep -v "services/domain/appointment.domain.js" | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 0 ]; then
            echo "❌ prisma.appointment.create domain katmanı DIŞINDA kullanılmış:"
            grep -rn "prisma\.appointment\.create" \
              backend/controllers backend/services backend/utils backend/adapters backend/helpers \
              2>/dev/null | grep -v "services/domain/appointment.domain.js"
            echo ""
            echo "Randevu oluşturmak için services/domain/appointment.domain.js → createAppointment() kullan."
            exit 1
          fi
          echo "✅ Randevu oluşturma tek kapıdan geçiyor"

  # ═══════════════════════════════════════════════════════════
  # 2 · DAĞIT — SSH ile
  # ═══════════════════════════════════════════════════════════
  deploy:
    name: Dağıt
    needs: verify
    # Push ile ASLA çalışmaz. Yalnızca elle tetiklendiğinde ve
    # onay kutusuna "dagit" yazıldığında.
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'dagit'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Settings → Environments → production'a onaylayıcı ekle:
    # main'e yanlışlıkla push etmenin maliyetini bir onay tıklamasına indiriyor.
    environment: production
    steps:
      - name: SSH anahtarını yükle
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sunucuda güncelle ve dağıt
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
          APP:  ${{ secrets.VPS_APP_PATH }}
        # Kodu artık sunucunun kendisi çekiyor (deploy key, read-only).
        # Runner checkout ETMİYOR ve rsync YOK: tek bir doğruluk kaynağı var,
        # sunucudaki klonun origin/main'i. Aynı dizine iki farklı yerden
        # (rsync + git) yazmak, hangisinin kazandığı belirsiz bir durum üretir.
        #
        # `git clean` istisnaları kritik: aşağıdaki dizinler sunucuda oluşuyor
        # ve depoda yok. .env, logs/, _backups/, .last-deployed-sha ve
        # backend/uploads/ .gitignore ile korunuyor (clean -x KULLANILMIYOR),
        # ama -e ile ikinci kez yazılıyorlar: .gitignore'dan biri düşerse
        # ilk otomatik dağıtım müşteri yüklemelerini silerdi.
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" bash -lc "'
            set -Eeuo pipefail
            cd \"$APP\"
            git fetch --prune origin main
            git reset --hard origin/main
            git clean -fd \
              -e backend/.env \
              -e backend/logs \
              -e backend/uploads \
              -e _backups \
              -e .last-deployed-sha
            chmod +x scripts/deploy.sh scripts/rollback.sh
            DEPLOY_SHA=\"${{ github.sha }}\" \
            DEPLOY_SUBJECT=\"${{ inputs.not }}\" \
            ALLOW_DB_PUSH=\"${{ inputs.sema_degisti }}\" \
            ./scripts/deploy.sh
          '"

  # ═══════════════════════════════════════════════════════════
  # 3 · DIŞARIDAN DOĞRULA
  # İçeriden "ayağa kalktı" demek yetmiyor — Nginx ayrı bir arıza yüzeyi.
  # ═══════════════════════════════════════════════════════════
  smoke:
    name: Dışarıdan doğrula
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && inputs.onay == 'dagit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backend sağlığı (SSH ile, içeriden)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        # NOT: https://app.instomer.com/health KULLANILMIYOR.
        # Nginx /health'i backend'e yönlendirmiyor, htdocs'tan index.html
        # döndürüyor — yani dışarıdan çağrı HER ZAMAN 200 verir ve backend
        # tamamen ölü olsa bile "sağlıklı" görünür. Yalnızca /api/* backend'e
        # gidiyor, bu yüzden nabzı sunucunun içinden ölçüyoruz.
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          for i in $(seq 1 10); do
            OUT=$(ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
                  'curl -fsS -m 8 http://127.0.0.1:5008/health' 2>/dev/null || true)
            if echo "$OUT" | grep -q '"status":"ok"'; then
              echo "✅ Backend sağlıklı (${i}. deneme): $OUT"; exit 0
            fi
            echo "... ${i}/10"; sleep 6
          done
          echo "❌ Backend /health yanıt vermiyor"; exit 1

      - name: Frontend dışarıdan erişilebilir mi?
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://app.instomer.com/login")
          [ "$code" = "200" ] || { echo "❌ /login → $code"; exit 1; }
          echo "✅ /login → 200"
          # Doğru bundle servis ediliyor mu? (Nginx eski dosyayı önbellekten
          # veriyorsa burada yakalanır.)
          if curl -s --max-time 10 "https://app.instomer.com/" | grep -qE 'assets/index-[A-Za-z0-9_-]+\.js'; then
            echo "✅ Bundle referansı bulundu: $(curl -s --max-time 10 https://app.instomer.com/ | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          else
            echo "❌ index.html içinde bundle referansı yok"; exit 1
          fi
